    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            background-color: #f4f6f8;
            color: #222;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        .tridy {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .trida {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .trida h2 {
            margin-top: 0;
            color: #174a7e;
            border-bottom: 2px solid #174a7e;
            padding-bottom: 8px;
        }

        .trida ul {
            list-style: none;
            padding: 0;
            margin-bottom: 0;
        }

        .trida li {
            margin: 10px 0;
        }

        .trida a {
            color: #1769aa;
            text-decoration: none;
        }

        .trida a:hover {
            text-decoration: underline;
        }
    </style>
</head>
